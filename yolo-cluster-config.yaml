
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: lenox-yolo-cluster
  region: us-east-1
  version: "1.28"

nodeGroups:
  - name: yolo-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    
    labels:
      app: yolo
      tier: application
    
    tags:
      kubernetes.io/cluster/lenox-yolo-cluster: "owned"
      Environment: "Learning"