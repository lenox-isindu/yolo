apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: lenox-yolo-cluster
  region: us-east-1
  version: "1.28"

iam:
  withOIDC: true  # This helps with addon permissions

managedNodeGroups:
  - name: yolo-workers
    instanceType: t3.small  # More available than t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    
    # REMOVED THIS LINE: availabilityZones: ["us-east-1a", "us-east-1b"]
    # Let eksctl automatically choose available AZs
    
    labels:
      app: yolo
      tier: application
    
    tags:
      kubernetes.io/cluster/lenox-yolo-cluster: "owned"
      Environment: "Learning"

# Enable cluster logging for better debugging
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]